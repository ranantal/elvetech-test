name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # .env is gitignored — it never ships in the repo, so it's written here
      # from a GitHub Actions secret. electron-builder's extraResources config
      # (apps/desktop-app/package.json) copies it into the packaged app,
      # where main.ts loads it via dotenv at runtime.
      - name: Write .env
        run: echo "API_TOKEN=${{ secrets.API_TOKEN }}" > .env

      # No signing identity is configured for this build, so tell
      # electron-builder not to try discovering/using one — otherwise it
      # fails outright on a runner with no certificate available.
      - name: Build and package the macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx nx run desktop-app:package

      - uses: actions/upload-artifact@v4
        with:
          name: elvetech-mac
          path: apps/desktop-app/release/*.dmg
